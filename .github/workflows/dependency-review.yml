name: dependency-review

# Fails a pull request that adds a dependency with a known HIGH or CRITICAL
# vulnerability. It reads only the dependency graph and needs no secrets.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A PR comment needs pull-requests: write, which this job does not get.
          comment-summary-in-pr: never
