name: dependency-review

# Fails a pull request that adds a dependency with a known HIGH or CRITICAL
# vulnerability. It reads only the dependency graph and needs no secrets.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # A PR comment needs pull-requests: write, which this job does not get.
          comment-summary-in-pr: never
