name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A release is only built from a commit that is already on main, so an
  # unreviewed commit cannot be tagged and published.
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

  # The full CI suite (lint, race tests, govulncheck, gitleaks) on the tagged
  # commit, not only the unit tests.
  ci:
    name: ci
    needs: verify-tag
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    # The signing secrets live on the "release" environment, which only v* tags
    # can deploy to. Branch and pull request runs cannot read them.
    environment: release
    permissions:
      contents: write
      id-token: write # sign the provenance and SBOM attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # the toolchain line in go.mod is the single source
          # A restored build cache could inject code into a signed release.
          cache: false
      # The registries verify the SHA256SUMS signature against the public key
      # registered for the namespace. See docs/releasing.md.
      - name: Import release signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      # GoReleaser names files with the version without the leading "v".
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The repository uses immutable releases: no file can be added after
      # GoReleaser publishes. So the SBOM is generated first, outside dist/
      # (which --clean empties), and GoReleaser attaches it as an extra file.
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            app -json -licenses -std -main . \
            -output "sbom/terraform-provider-nodeping_${VERSION}_sbom.cdx.json" .
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # v2.18 and later need Go 1.27.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
      # Build provenance for every archive in SHA256SUMS. Users can check a
      # download with `gh attestation verify <archive> -R <this repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/terraform-provider-nodeping_${{ steps.version.outputs.version }}_SHA256SUMS
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/terraform-provider-nodeping_${{ steps.version.outputs.version }}_SHA256SUMS
          sbom-path: sbom/terraform-provider-nodeping_${{ steps.version.outputs.version }}_sbom.cdx.json
