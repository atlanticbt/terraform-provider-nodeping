name: scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices and uploads
# the findings to code scanning. publish_results makes the score public at
# scorecard.dev; the action then requires this job to contain only these steps.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
