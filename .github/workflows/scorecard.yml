name: scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices and uploads
# the findings to code scanning. publish_results makes the score public at
# scorecard.dev; the action then requires this job to contain only these steps.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
