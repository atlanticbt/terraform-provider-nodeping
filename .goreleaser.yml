version: 2

project_name: terraform-provider-nodeping

before:
  hooks:
    # `go mod tidy` can mutate go.mod/go.sum mid-release, shipping dependencies
    # that differ from what CI tested. Download only.
    - go mod download

builds:
  - binary: '{{ .ProjectName }}_v{{ .Version }}'
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: without this, binaries embed build time and differ
    # byte-for-byte between runs of the same commit.
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# No GPG signing block, deliberately.
#
# OpenTofu enforces GPG validation only for providers served from a self-hosted
# *origin registry*. Filesystem, network, and OCI mirrors require no signature,
# no SHA256SUMS, and no terraform-registry-manifest.json — and there is no way
# to opt into enforcement for a mirror even if you wanted it.
#
# We publish through a network mirror, so a signature would be generated, stored,
# and never checked by anything. Integrity is covered instead by the h1 hashes in
# the mirror index (see tools/mirror-index), which OpenTofu does verify on
# install and records in the consumer's dependency lock file.
#
# If this ever moves to a self-hosted origin registry, signing becomes mandatory:
# restore a `signs:` block with `--local-user` pinned to an explicit fingerprint,
# and add the registry manifest as an extra_files entry.

release:
  # Bitbucket is not a goreleaser publish target. The pipeline runs with
  # --skip=publish and uploads to the ABT provider mirror.
  disable: true
